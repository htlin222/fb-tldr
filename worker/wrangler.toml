name = "fb-tldr-proxy"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Workers AI binding. env.AI.run(...) runs models on Cloudflare's edge.
# Free allocation: 10,000 Neurons/day.
[ai]
binding = "AI"

# Serve the Worker from your own hostname so Cloudflare Access (Zero Trust)
# can sit in front of it. The zone example.com must already be on this
# Cloudflare account. Remove this block to test on *.workers.dev (Access off).
[[routes]]
pattern = "fb-tldr.example.com"
custom_domain = true
